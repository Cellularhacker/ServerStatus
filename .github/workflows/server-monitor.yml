name: Server monitor

on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: server-monitor
  cancel-in-progress: false

jobs:
  monitor:
    # Set MONITOR_RUNNER to a JSON array, e.g. ["self-hosted","linux","ipv6"].
    runs-on: ${{ fromJSON(vars.MONITOR_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check servers and reconcile incidents
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 monitoring/monitor.py
